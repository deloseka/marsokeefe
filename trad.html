  <body>
  <h1>Traditional Work</h1>
    <div class="row">
            <div class="row">
                <img class="portimg" src="./Files/Images/Portfolio/Personal/Traditional/2020_moo.jpg" onclick="onClick(this)" alt="Moo, 2020. Black paper and white pencil.">
                <img class="portimg" src="./Files/Images/Portfolio/Personal/Traditional/2020_succulent.jpg" onclick="onClick(this)" alt="Succulent, 2020. Watercolor.">
                <img class="portimg" src="./Files/Images/Portfolio/Personal/Traditional/2021_gummy.jpg" onclick="onClick(this)" alt="Gummy Bears, 2021. Colored Pencil.">
            </div>
            <div class="row">
                <img class="portimg" src="./Files/Images/Portfolio/Personal/Traditional/2021_point.jpg" onclick="onClick(this)" alt="Pointsetta, 2021. Pastel.">
                <img class="portimg" src="./Files/Images/Portfolio/Personal/Traditional/2021_road.jpg" onclick="onClick(this)" alt="Road, 2021. Watercolor.">
                <img class="portimg" src="./Files/Images/Portfolio/Personal/Traditional/2022_bird.jpg" onclick="onClick(this)" alt="Bird,2021. Watercolor.">
            </div>
            <div class="row">
                <img class="portimg" src="./Files/Images/Portfolio/Personal/Traditional/2024_bebe.jpg" onclick="onClick(this)" alt="Pets, 2024. Watercolor.">
                <img class="portimg" src="./Files/Images/Portfolio/Personal/Traditional/2024_kit.jpg" onclick="onClick(this)" alt="Kit Kat, 2024. Watercolor.">

            </div>      
    </div>
    
            <div class="modal" onclick="this.style.display='none'">
                        <span class="portbutton">×</span>
                        <div class="modal-content">
                        <img class="inimage">
                        <p id="caption"></p>
                        </div>
                    </div>
        <script>
          /* Modal Image Gallery – class‑based version */
          function onClick(element) {
              // Grab the first element that matches the selector
              const img   = document.querySelector('.inimage');
              const modal = document.querySelector('.modal');

              if (img && modal) {
                  img.src = element.src;          // show the clicked picture
                  modal.style.display = 'block';  // make the overlay visible
                  const captionText = document.getElementById('caption');
                  if (captionText) captionText.innerHTML = element.alt;
              } else {
                  console.warn('Modal elements not found in the DOM.');
              }
          }
        </script>
        
  </body>
