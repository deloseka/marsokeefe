    <div class="row">
            <div class="row">

                <img class="portimg" src="./Files/Images/Portfolio/School/Photography/car.JPG" onclick="onClick(this)" alt="Car Lights, 2024.">
                <img class="portimg" src="./Files/Images/Portfolio/School/Photography/Complicated.jpg" onclick="onClick(this)" alt="Complicated, 2024.">
            </div>
            <div class="row">
                <img class="portimg" src="./Files/Images/Portfolio/School/Photography/crochet.jpg" onclick="onClick(this)" alt="Crochet, 2024.">
                <img class="portimg" src="./Files/Images/Portfolio/School/Photography/deer.jpg" onclick="onClick(this)" alt="Deers, 2024.">

            </div>
            <div class="row">
                <img class="portimg" src="./Files/Images/Portfolio/School/Photography/Instrument.jpg" onclick="onClick(this)" alt="Instruments, 2024.">

            <div class="modal" onclick="this.style.display='none'">
                        <span class="portbutton">×</span>
                        <div class="modal-content">
                        <img class="inimage">
                        <p id="caption"></p>
                        </div>
                    </div>
        <script>
          /* Modal Image Gallery – class‑based version */
          function onClick(element) {
              // Grab the first element that matches the selector
              const img   = document.querySelector('.inimage');
              const modal = document.querySelector('.modal');

              if (img && modal) {
                  img.src = element.src;          // show the clicked picture
                  modal.style.display = 'block';  // make the overlay visible
                  const captionText = document.getElementById('caption');
                  if (captionText) captionText.innerHTML = element.alt;
              } else {
                  console.warn('Modal elements not found in the DOM.');
              }
          }
        </script>
