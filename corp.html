<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <link rel="stylesheet" media="screen" href="./Files/CSS/portfolio.css" type="text/css"/>
    <link rel="icon" type="image/x-icon" href="./Files/Images/ico.ico">
    <meta name="robots" content="noindex, nofllow, noai, noimageai">
    <meta http-equiv="X=UA-Compatible" content="IE=edge">

    <meta name="description" content="Mars O'Keefe's website">
    <meta name="license" content="CC BY-NC-SA">
  </head>
  <body>
  <h1>Corporate & Agency Work</h1>
    <div class="row">
      <img class="portimg" src="./Files/Images/Portfolio/Personal/2026_elaris.png" onclick="onClick(this)" alt="Elaris (2026). Brand poster created in Illustrator for VTuber agency Elaris.">
      <img class="portimg" src="./Files/Images/Portfolio/CUP/2026_jessaminebooks.png" onclick="onClick(this)" alt="Jesamine Books (2026). Brand poster created in Illustrator for Jessamine Books Imprint.">
      <img class="portimg" src="./Files/Images/Portfolio/CUP/Book Covers/2024/2024_fightinglikecatsanddogs.jpg" onclick="onClick(this)" alt="Fighting Like Cats and Dogs (2024). Illustrator. Commissioned by Clemson University Press.">
    </div>
    <div class="row">
      <img class="portimg" src="./Files/Images/Portfolio/CUP/Book Covers/2025/2024_slowlife.jpg" onclick="onClick(this)" alt="A Slow Life but a Good Life (2025). Illustrator. Commissioned by Clemson University Press.">
      <img class="portimg" src="./Files/Images/Portfolio/CUP/Book Covers/2025/2025_lookingglassrock.jpg" onclick="onClick(this)" alt="Looking Glass Rock (2025). Illustrator. Commissioned by Clemson University Press.">
      <img class="portimg" src="./Files/Images/Portfolio/CUP/Book Covers/2025/2025_maryville.jpg" onclick="onClick(this)" alt="Maryville (2025). Illustrator. Commissioned by Clemson University Press.">
    </div>
    <div class="row">
      <img class="portimg" src="./Files/Images/Portfolio/CUP/Book Covers/2025/2025_underonecanopy.jpg" onclick="onClick(this)" alt="Under One Canopy (2026). Illustrator. Commissioned by Clemson University Press.">
    </div>
    <div class="modal" onclick="this.style.display='none'">
                        <span class="portbutton">×</span>
                        <div class="modal-content">
                        <img class="inimage">
                        <p id="caption"></p>
                        </div>
    </div>
    <script>
          /* Modal Image Gallery – class‑based version */
          function onClick(element) {
              // Grab the first element that matches the selector
              const img   = document.querySelector('.inimage');
              const modal = document.querySelector('.modal');

              if (img && modal) {
                  img.src = element.src;          // show the clicked picture
                  modal.style.display = 'block';  // make the overlay visible
                  const captionText = document.getElementById('caption');
                  if (captionText) captionText.innerHTML = element.alt;
              } else {
                  console.warn('Modal elements not found in the DOM.');
              }
          }
    </script>
  </body>
</html>
